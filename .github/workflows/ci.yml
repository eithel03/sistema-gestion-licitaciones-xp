name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Licitaciones.sln

      - name: Build
        run: dotnet build Licitaciones.sln --configuration Release --no-restore

      - name: Install Playwright Chromium
        run: pwsh tests/Licitaciones.E2ETests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Unit tests with coverage
        run: dotnet test tests/Licitaciones.UnitTests/Licitaciones.UnitTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Integration tests with coverage
        run: dotnet test tests/Licitaciones.IntegrationTests/Licitaciones.IntegrationTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Functional tests with coverage
        run: dotnet test tests/Licitaciones.FunctionalTests/Licitaciones.FunctionalTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: E2E tests
        run: dotnet test tests/Licitaciones.E2ETests/Licitaciones.E2ETests.csproj --configuration Release --no-build

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
