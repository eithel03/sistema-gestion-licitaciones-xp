apiVersion: v1
kind: Service
metadata:
  name: licitaciones-api
  namespace: licitaciones
spec:
  selector:
    app: licitaciones-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: licitaciones-web
  namespace: licitaciones
spec:
  type: NodePort
  selector:
    app: licitaciones-web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080